services:
  site:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      # React 프로덕션 빌드가 사이트의 본체다 (web/에서 npm run build로 생성)
      - ./web/dist:/usr/share/nginx/html:ro
      # 설정집은 dist의 사본 대신 원본을 겹쳐 마운트 — 원본 수정이 빌드 없이 바로 반영된다
      - ./세계관 설정:/usr/share/nginx/html/world:ro
      # SPA 라우팅(try_files) 설정
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
