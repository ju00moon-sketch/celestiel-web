<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameDevelop</title>
<style>
  :root{
    --bg:#111110; --surface:#1a1a19; --line:#3a3a37;
    --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#8b8a80; --gold:#c9a227;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink-2);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard","Noto Sans KR",sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  main{width:100%; max-width:560px;}
  h1{
    font-size:13px; letter-spacing:.32em; color:var(--ink-3);
    margin-bottom:36px; text-transform:uppercase;
  }
  .links{display:flex; flex-direction:column; gap:12px;}
  a.card{
    display:block; padding:20px 22px; background:var(--surface);
    border:1px solid var(--line); border-radius:4px;
    text-decoration:none; color:var(--ink); transition:border-color .2s;
  }
  a.card:hover{border-color:var(--gold);}
  a.card .t{font-size:16px; margin-bottom:5px;}
  a.card .d{font-size:12.5px; color:var(--ink-3);}
  footer{margin-top:36px; font-size:11px; color:var(--ink-3); letter-spacing:.08em;}
</style>
</head>
<body>
<main>
  <h1>GameDevelop</h1>
  <div class="links">
    <a class="card" href="/world/celestiel-codex.html">
      <div class="t">CELESTIEL — 세계관 설정집</div>
      <div class="d">세계관 · 인과율 · 천족 위계 · 지리</div>
    </a>
  </div>
  <footer>이 목록은 공개용 페이지만 표시합니다. 다운로드 페이지는 아직 없습니다.</footer>
</main>
</body>
</html>
