# CELESTIEL — React 빌드(web/dist) 서빙용 nginx 설정.
# SPA 라우트(/world, /download 등)는 파일이 없으므로 index.html로 되돌려
# React Router가 처리하게 한다. 실제 파일(assets, codex HTML)은 그대로 서빙.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 해시 붙은 빌드 산출물은 오래 캐시해도 안전하다
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 설정집 원본은 자주 바뀌므로 캐시하지 않는다
    location /world/celestiel-codex.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        # $uri/ 를 넣지 않는다 — /world 는 마운트된 실제 디렉터리라서
        # 디렉터리 매칭을 허용하면 301(/world/)로 새고 React 라우트가 죽는다.
        # 파일이 아니면 전부 index.html로 보내 React Router가 처리하게 한다.
        try_files $uri /index.html;
    }
}
